stages:
  - test
  - build

test:
  stage: test
  image: rust:1.83-alpine
  before_script:
    - apk add --no-cache musl-dev build-base
  script:
    - cargo test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "streaming-tags"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_MERGE_REQUEST_ID

build:
  stage: build
  image: rust:1.83-alpine
  before_script:
    - apk add --no-cache musl-dev build-base
  script:
    - cargo build --release
    - cp target/release/asciinema asciinema-linux-$(uname -m)
  artifacts:
    paths:
      - asciinema-linux-*
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^dvr-/
    - if: $CI_COMMIT_BRANCH == "streaming-tags"
    - if: $CI_COMMIT_BRANCH == "develop"
